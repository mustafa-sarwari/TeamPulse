<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamPulse — Team task board</title><link rel="stylesheet" href="styles.css"><script>
if(location.protocol!=='file:'&&!location.hostname.endsWith('.github.io')){
 const enableAccount=()=>{const s=document.createElement('script');s.src='/account.js';document.head.append(s);};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enableAccount,{once:true});else enableAccount();
}
</script>
</head><body><main><header><p>TEAM WORKSPACE</p><h1>TeamPulse</h1><p>A local team and task board for your demo session.</p></header><p id="status" role="status" aria-live="polite"></p><section class="controls"><form id="team-form"><h2>Create a team</h2><label for="team-name">Team name</label><input id="team-name" maxlength="80" required><button>Create team</button></form><form id="task-form"><h2>Add a task</h2><label for="task-title">Task title</label><input id="task-title" maxlength="200" required><label for="task-team">Team</label><select id="task-team" required></select><button>Add task</button></form></section><section><h2>Your tasks</h2><label for="team-filter">Filter by team</label><select id="team-filter"><option value="">All teams</option></select><div id="board" class="board"></div></section></main><script src="app.js" defer></script></body></html>
